<h1>Avatar</h1>
<p>A person or a thing in a circle the height of a control: a picture, or the initials. The name is <code>alt</code> on the picture and <code>aria-label</code> on the initials.</p>

<p class="row">
  <span class="avatar" role="img" aria-label="Paola Esempio">PE</span>
  <span class="avatar" role="img" aria-label="Giulio Rossi">GR</span>
  <img class="avatar" alt="Quince" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' fill='%23e8b923'/%3E%3Ccircle cx='20' cy='24' r='11' fill='%23c98a12'/%3E%3C/svg%3E">
</p>
