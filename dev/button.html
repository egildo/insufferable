<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>insufferable · button</title>
<link rel="stylesheet" href="../dist/insufferable.css">
<script type="module" src="../dist/components/icon.js"></script>
<script type="module" src="../dist/components/tabs.js"></script>
<style>
  body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
  .row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
</style>

<h1>Buttons</h1>

<h2>The variants</h2>
<p class="row">
  <button>Outlined</button>
  <button class="solid">Solid</button>
  <button class="plain">Plain</button>
</p>

<h2>Disabled</h2>
<p class="row">
  <button disabled>Outlined</button>
  <button class="solid" disabled>Solid</button>
  <button class="plain" aria-disabled="true">Plain</button>
</p>

<h2>With an icon</h2>
<p class="row">
  <button><ins-icon name="search"></ins-icon> Search</button>
  <button class="solid"><ins-icon name="heart"></ins-icon> Favourite</button>
  <button class="plain" aria-label="Close"><ins-icon name="x"></ins-icon></button>
</p>

<h2>Icon buttons</h2>
<p>A button holding an icon and named by <code>aria-label</code> is square. Pressed, it takes the accent.</p>
<p class="row">
  <button aria-label="Search"><ins-icon name="search"></ins-icon></button>
  <button class="solid" aria-label="Favourite"><ins-icon name="heart"></ins-icon></button>
  <button class="plain" aria-label="Settings"><ins-icon name="settings"></ins-icon></button>
  <button class="plain" aria-label="Show help" aria-pressed="true"><ins-icon name="help-circle"></ins-icon></button>
  <button class="plain" aria-label="Home" disabled><ins-icon name="home"></ins-icon></button>
</p>

<h2>With a count</h2>
<p class="row">
  <button>Messages <data value="3">3</data></button>
  <button class="solid">Print <data value="2">2</data></button>
  <button class="plain" aria-pressed="true">Unread <data value="12">12</data></button>
</p>

<h2>Beside a tab list, untouched by it</h2>
<ins-tabs aria-label="Fruit">
  <button aria-controls="apple">Apple</button>
  <button aria-controls="pear">Pear</button>
</ins-tabs>
<div id="apple">An apple.</div>
<div id="pear">A pear.</div>
</html>
