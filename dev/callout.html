<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>insufferable · callout</title>
<link rel="stylesheet" href="../dist/insufferable.css">
<script type="module" src="../dist/components/icon.js"></script>
<style>
  body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
  [role] { margin-block: 1rem; }
</style>

<h1>Callouts</h1>

<div role="note">
  <p><insufferable-icon name="info-circle"></insufferable-icon> A quince is too hard to eat raw. <a href="#cooking">Cook it first</a>.</p>
</div>

<div role="note" class="danger">
  <p>Quince seeds hold amygdalin. Do not eat them.</p>
  <p>The flesh is safe once cooked.</p>
</div>

<p><button id="save">Save the recipe</button></p>
<div id="out"></div>

<p id="cooking">Cooking.</p>

<script type="module">
  // An alert is announced when it is added: the callout that appears after an action.
  document.getElementById('save').addEventListener('click', () => {
    document.getElementById('out').innerHTML = '<div role="alert" class="danger"><p>The recipe has no title.</p></div>';
  });
</script>
</html>
