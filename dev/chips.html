<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>insufferable · chips</title>
<link rel="stylesheet" href="../dist/insufferable.css">
<script type="module" src="../dist/components/icon.js"></script>
<style>
  body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
  pre { background: color-mix(in srgb, currentColor 6%, transparent); padding: 0.5rem; min-height: 3lh; }
</style>

<h1>Chips</h1>
<p>A list of removable values, <code>&lt;ul class="chips"&gt;</code>. Each button sends <code>--remove</code> to the list with its value; the app removes it. This page is the app.</p>

<h2>Declarations</h2>
<ul class="chips" id="declarations" aria-label="Declarations">
  <li><code>hyphens: none</code> <button commandfor="declarations" command="--remove" value="hyphens" aria-label="Remove hyphens: none"><insufferable-icon name="x"></insufferable-icon></button></li>
  <li><code>color: #2a58c5</code> <button commandfor="declarations" command="--remove" value="color" aria-label="Remove color: #2a58c5"><insufferable-icon name="x"></insufferable-icon></button></li>
  <li><code>letter-spacing: -0.5pt</code> <button commandfor="declarations" command="--remove" value="letter-spacing" aria-label="Remove letter-spacing: -0.5pt"><insufferable-icon name="x"></insufferable-icon></button></li>
</ul>

<h2>Fruit</h2>
<ul class="chips" id="fruit" aria-label="Fruit">
  <li>Quince <button commandfor="fruit" command="--remove" value="quince" aria-label="Remove Quince"><insufferable-icon name="x"></insufferable-icon></button></li>
  <li>Medlar <button commandfor="fruit" command="--remove" value="medlar" aria-label="Remove Medlar"><insufferable-icon name="x"></insufferable-icon></button></li>
</ul>

<h2>Every command, heard at the root</h2>
<pre id="log"></pre>

<script type="module">
  const log = document.getElementById('log');
  document.addEventListener('command', (event) => {
    if (event.command !== '--remove') return;
    log.textContent += `--remove "${event.source.value}" from #${event.target.id}\n`;
    const item = event.source.closest('li');
    const next = item.nextElementSibling ?? item.previousElementSibling;
    item.remove();
    next?.querySelector('button')?.focus();
  }, { capture: true });
</script>
</html>
