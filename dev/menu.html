<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>insufferable · menu</title>
<link rel="stylesheet" href="../dist/insufferable.css">
<script type="module" src="../dist/components/icon.js"></script>
<script type="module" src="../dist/components/menu.js"></script>
<style>
  body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
  pre { background: color-mix(in srgb, currentColor 6%, transparent); padding: 0.5rem; min-height: 4lh; }
</style>

<h1>Menus</h1>

<p>
  <button commandfor="edit" command="toggle-popover">Edit <ins-icon name="chevron-down"></ins-icon></button>
  <button>After the menu</button>
</p>
<ins-menu id="edit" popover>
  <button commandfor="editor" command="--cut">Cut</button>
  <button commandfor="editor" command="--copy">Copy</button>
  <hr>
  <button disabled>Paste</button>
  <button commandfor="editor" command="--select-all">Select all</button>
</ins-menu>

<div id="editor" tabindex="-1">An editor the menu's items speak to.</div>

<h2>What the page heard</h2>
<pre id="log"></pre>

<script type="module">
  const log = document.getElementById('log');
  const say = (line) => (log.textContent += line + '\n');
  // The items' commands and the menu's own opening and closing, all heard at the root in the capture phase.
  document.addEventListener('command', (event) => say(`command ${event.command} to ${event.target.id}`), { capture: true });
  document.addEventListener('toggle', (event) => event.target.localName === 'ins-menu' && say(`menu ${event.newState}`), { capture: true });
</script>
</html>
