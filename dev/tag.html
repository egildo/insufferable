<h1>Tags</h1>
<p>A kind or a status beside a name, in <code>&lt;small class="tag"&gt;</code>. The text is written as it reads; the capitals are the stylesheet's.</p>

<p><code>cliente</code> <small class="tag">String</small></p>
<p><code>domiciliata</code> <small class="tag">Boolean</small></p>
<p><code>tariffa</code> <small class="tag">String</small> <small class="tag">Inherited</small></p>
